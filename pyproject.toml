[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scorecard"
version = "1.0.0"
description = "Retail credit application scorecard: WoE logistic regression, points scaling and a scoring API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.1,<3", "numpy", "pyarrow", "pandera[pandas]", "optbinning", "statsmodels",
    "scikit-learn", "scipy", "lightgbm", "shap", "fastapi", "pydantic>=2", "uvicorn",
    "matplotlib", "jinja2", "markdown", "pyyaml", "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scorecard = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "silent"
